# Turnypt build configuration.
#
# Memory-constrained by design: compilation and packaging are serialized
# (single worker, no parallel execution) so peak memory stays predictable
# on machines with limited RAM. Kotlin compilation runs in a shared
# compiler daemon whose heap is capped; environments below ~4 GiB RAM
# should additionally set kotlin.compiler.execution.strategy=inline in
# their user-level gradle.properties to keep everything in one JVM.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx1536m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
